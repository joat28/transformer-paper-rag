[project]
name = "medical-guideline-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prabhat Rao", email = "prabhat.rao@iitg.ac.in" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "streamlit>=1.62.0",
]

[project.scripts]
medical-guideline-assistant = "medical_guideline_assistant:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
